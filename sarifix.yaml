# sarifix: runs these scanners, uploads their findings to code scanning,
# keeps one issue per batch for agent-queue.yml to fix, and on pull requests
# reports what the change introduced. Workflow:
# .github/workflows/sarifix.yml. Reference:
# https://rossedman.io/sarifix/configuration/
version: 1

scanners:
  # The repo's own .golangci.yml, so findings match `make lint`.
  - name: golangci-lint
    command: ["golangci-lint", "run", "--output.sarif.path={out}", "./..."]
    workdir: "{dir}"
    scope: dir

  # Known vulnerabilities in go.mod and docs/requirements.txt, secrets, and
  # misconfiguration.
  - name: trivy
    match: ["Trivy"]
    command: ["trivy", "fs", "--scanners", "vuln,secret,misconfig", "--format", "sarif", "-o", "{out}", "."]
    workdir: "{dir}" # "." keeps paths repo-relative, as code scanning needs
    timeout: 10m

  # Semgrep's Go and secrets rules from its registry; metrics off.
  - name: semgrep
    match: ["Semgrep OSS"]
    command: ["semgrep", "scan", "--config", "p/golang", "--config", "p/secrets", "--metrics", "off", "--sarif", "--output", "{out}", "."]
    workdir: "{dir}"
    timeout: 10m

rules:
  # Rules the sarifix workflow may open issues for, and so hand to the agent
  # queue (the SARIFIX_QUEUE variable). Deny a rule you won't fix: the next
  # scan closes its issue.
  allow: ["golangci-lint/*", "trivy/*", "semgrep/*"]
  deny: []
  min_level: warning

paths:
  # Generated: tools/gendocs writes these, and fuzz inputs are regression seeds.
  # Workflows too, sarifix's default: the queue's token can't push them.
  deny:
    - ".github/workflows/**"
    - "docs/reference/commands/**"
    - "**/testdata/fuzz/**"

publish:
  issues:
    max_open: 10 # the most severe batches; the rest open as these close
