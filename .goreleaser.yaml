# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Builds and releases limabean. Releases run from .github/workflows/release.yml
# when a v* tag is pushed; pull requests get snapshot builds from
# .github/workflows/snapshot.yml. Locally: goreleaser release --snapshot --clean --skip=sign
version: 2

project_name: limabean

builds:
  - id: limabean
    main: ./cmd/limabean
    binary: limabean
    env:
      - CGO_ENABLED=0
    # macOS only: limabean uses the Keychain and Claude Desktop for Mac.
    goos: [darwin]
    goarch: [arm64, amd64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

# One binary for Apple Silicon and Intel Macs.
universal_binaries:
  - id: limabean
    replace: true

archives:
  - id: limabean
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_darwin_universal"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# Keyless Sigstore signature of checksums.txt, which covers every archive,
# with the release workflow's GitHub identity: no keys or secrets. Snapshot
# builds skip it (--skip=sign). How to verify: SECURITY.md.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot+{{ .ShortCommit }}"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^Merge "

# brew install rossedman/tap/limabean. GoReleaser writes Casks/limabean.rb
# to rossedman/homebrew-tap, with a fine-grained token that can write only
# to that repo (the HOMEBREW_TAP_GITHUB_TOKEN secret). Pre-releases skip it.
homebrew_casks:
  - name: limabean
    ids: [limabean]
    repository:
      owner: rossedman
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "limabean {{ .Tag }}"
    homepage: https://github.com/rossedman/limabean
    description: Disposable Ubuntu dev VMs on macOS, built on Lima
    skip_upload: auto
    dependencies:
      - formula: lima
    hooks:
      post:
        # The binary isn't notarized: without this, macOS refuses to run it.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/limabean"]
          end

release:
  github:
    owner: rossedman
    name: limabean
  prerelease: auto
  footer: |
    ## Install

    ```bash
    brew install rossedman/tap/limabean
    ```

    Or download the binary:

    ```bash
    curl -fsSL https://github.com/rossedman/limabean/releases/download/{{ .Tag }}/limabean_{{ .Version }}_darwin_universal.tar.gz | tar -xz limabean
    xattr -d com.apple.quarantine limabean 2>/dev/null; mv limabean ~/.local/bin/
    ```

    Or with Go: `go install github.com/rossedman/limabean/cmd/limabean@{{ .Tag }}`
