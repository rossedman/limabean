# Layer 1: operating system and VM shape. No host mounts: code lives in the VM.
minimumLimaVersion: 2.0.0

# Ubuntu 26.04 LTS: systemd 259, with Varlink (varlinkctl, io.systemd.*).
# 24.04's systemd 255 is too old for Varlink tools such as vlx (v257+).
base:
- template:_images/ubuntu-26.04

vmType: vz
# Rosetta runs x86_64 Linux binaries and linux/amd64 containers on Apple
# Silicon; binfmt registers it so they run without a prefix. On Intel Macs
# Lima logs that it's unavailable and boots normally.
vmOpts:
  vz:
    rosetta:
      enabled: true
      binfmt: true
cpus: 4
memory: 8GiB
disk: 50GiB

user:
  # zsh from the moment the account exists. Changing the shell later doesn't
  # reach sessions: Lima's SSH connection is persistent and keeps the shell it
  # saw at login. Installed by features/zsh-install.sh (dependency mode),
  # before the first login.
  shell: /usr/bin/zsh

ssh:
  # Use the Mac's ssh-agent for git push; keys never enter the VM.
  forwardAgent: true

# Containers: Docker Engine (features/docker.sh) brings its own containerd,
# so Lima's containerd and nerdctl are turned off.
containerd:
  system: false
  user: false
