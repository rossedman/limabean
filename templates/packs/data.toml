duckdb = "1.5.6"
miller = "6.22.0"   # mlr
"pipx:jupyterlab" = "4.6.5"   # jupyter-lab, installed with uv; with a project's libraries: uv run --with jupyter jupyter lab
"pipx:visidata" = "3.5"   # vd
uv = "0.13.6"   # installs jupyterlab and visidata
