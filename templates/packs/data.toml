# Data: DuckDB, JupyterLab with pandas, polars and plotting libraries, VisiData and Miller.
[tools]
duckdb = "1.5.6"
miller = "6.22.0"   # mlr
# jupyter-lab, installed with uv. Its notebooks get these libraries; with a project's own instead: uv run --with jupyter jupyter lab
"pipx:jupyterlab" = { version = "4.6.4", uvx_args = "--with numpy==2.5.4 --with pandas==3.0.6 --with polars==2.0.0 --with pyarrow==26.0.0 --with duckdb==1.5.6 --with matplotlib==3.11.2 --with seaborn==0.13.2 --with plotly==7.1.0 --with ipywidgets==8.1.9" }
"pipx:visidata" = "3.4"   # vd
uv = "0.13.1"   # installs jupyterlab and visidata
