# Data: DuckDB, JupyterLab, VisiData and Miller, for exploring data files.
[tools]
duckdb = "1.5.6"
miller = "6.22.0"   # mlr
"pipx:jupyterlab" = "4.6.4"   # jupyter-lab, installed with uv; with a project's libraries: uv run --with jupyter jupyter lab
"pipx:visidata" = "3.4"   # vd
uv = "0.13.1"   # installs jupyterlab and visidata
