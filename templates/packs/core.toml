# Core: the shell tools every VM has, and that limabean itself relies on.
# Pinned so rebuilds are reproducible; `limabean bump` updates them.
[tools]
ripgrep = "15.2.0"
fzf = "0.74.5"
bat = "0.26.1"   # pager in the host gitconfig
gh = "2.102.0"
yq = "4.54.1"
fd = "10.5.0"
direnv = "2.38.2"   # hooked into the shell by features/shell.sh
ghq = "1.11.2"   # limabean get and code
glow = "3.0.0"
gum = "2.0.2"
shellcheck = "0.11.0"
shfmt = "3.14.1"   # shell formatter
svu = "3.4.1"
delta = "0.20.1"   # readable diffs
lazygit = "0.66.2"
just = "1.59.0"   # task runner
hyperfine = "2.0.0"   # benchmarks
