# Tools every environment gets, pinned so rebuilds are reproducible.
# To upgrade: change a version here, then rebuild the VM.
# (`mise latest <tool>` inside a VM shows the newest version.)
[tools]
# shell
ripgrep = "15.2.0"
fzf = "0.74.5"
bat = "0.26.1"   # pager in the host gitconfig
gh = "2.102.0"
yq = "4.54.1"
fd = "10.5.0"
direnv = "2.38.2"   # hooked into bash by features/shell.sh
ghq = "1.11.2"
glow = "3.0.0"
gum = "2.0.2"
shellcheck = "0.11.0"
svu = "3.4.1"

# go
go = "1.27.2"
goreleaser = "2.18.3"
golangci-lint = "2.14.0"

# python (interpreter and pip come from apt; uv for projects;
# other versions: `mise use python@<v>`, which replaces pyenv)
uv = "0.13.1"

# infra
kubectl = "1.37.1"
helm = "4.3.1"
kind = "0.33.0"
k9s = "0.51.0"
terraform = "1.16.6"   # other versions: `mise use terraform@<v>` (replaces tfswitch)
aws-cli = "2.38.1"

# supply chain
cosign = "3.1.3"
syft = "1.54.1"
grype = "0.120.1"
