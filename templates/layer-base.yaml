# Layer 2: everything every environment gets.
# Tools come in packs (templates/packs/): core is always here, and limabean
# adds the others a VM gets as mise TOMLs in /etc/limabean/mise/ and apt
# lists in /etc/limabean/apt/. features/mise.sh and packs-apt.sh install them.
base:
- ./layer-os.yaml

param:
  # Host directory with your git config, mounted read-only into every VM.
  # The default is git's own XDG location. If yours lives elsewhere (for
  # example a dotfiles repo), override it; see docs/getting-started.md.
  gitConfigDir: "~/.config/git"
  # Where ghq clones repositories inside the VM, e.g.
  # ~/code/github.com/<owner>/<repo>.
  codeDir: "~/code"
  # Lima disk mounted over codeDir so it survives a rebuild; limabean
  # passes it when the CODE_DISK setting is on. Empty: none.
  codeDisk: ""
  # Host directory with this VM's network policy (network.conf), mounted
  # read-only; limabean passes ~/.config/limabean/network/<vm>. An empty
  # directory means an open network.
  networkDir: "~/.config/limabean/network/default"

mounts:
- location: "{{.Param.gitConfigDir}}"
  mountPoint: /mnt/host/git
  writable: false
- location: "{{.Param.networkDir}}"
  mountPoint: /mnt/host/limabean
  writable: false

provision:
- mode: dependency
  file: ./features/zsh-install.sh
- mode: system
  file: ./features/apt-upgrade.sh
- mode: system
  file: ./features/apt-common.sh
- mode: system
  file: ./features/packs-apt.sh
- mode: system
  file: ./features/docker.sh
- mode: system
  file: ./features/code-disk.sh
- mode: data
  path: /usr/local/sbin/limabean-network
  file: ./files/limabean-network
  permissions: 755
- mode: system
  file: ./features/network.sh
- mode: data
  path: /etc/limabean/mise/00-core.toml
  file: ./packs/core.toml
- mode: data
  path: "{{.Home}}/.editorconfig"
  file: ./files/editorconfig
  owner: "{{.User}}:{{.User}}"
- mode: data
  path: "{{.Home}}/.config/limabean/env.sh"
  file: ./files/env.sh
  owner: "{{.User}}:{{.User}}"
- mode: data
  path: "{{.Home}}/.zshrc"
  file: ./files/zshrc
  owner: "{{.User}}:{{.User}}"
- mode: data
  path: /usr/local/bin/limabean-github-git
  file: ./files/limabean-github-git
  permissions: 755
- mode: data
  path: /usr/local/bin/limabean-info
  file: ./files/limabean-info
  permissions: 755
- mode: data
  path: /usr/local/bin/limabean-statusline
  file: ./files/limabean-statusline
  permissions: 755
- mode: data
  path: "{{.Home}}/.zshenv"
  content: |
    . "$HOME/.config/limabean/env.sh"
  owner: "{{.User}}:{{.User}}"
- mode: user
  file: ./features/mise.sh
- mode: user
  file: ./features/completions.sh
- mode: user
  file: ./features/git.sh
- mode: user
  file: ./features/claude.sh
- mode: user
  file: ./features/shell.sh

probes:
- description: mise tools are installed
  script: |
    #!/bin/bash
    set -eux -o pipefail
    if ! timeout 600s bash -c 'until test -f ~/.local/state/limabean/mise.done; do sleep 5; done'; then
      echo >&2 "mise tools are not installed yet"
      exit 1
    fi
  hint: Check /var/log/cloud-init-output.log inside the VM.
