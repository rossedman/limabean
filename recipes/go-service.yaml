# A Go service with Postgres in Docker.
# Start from it: limabean recipes go-service && limabean up
packs: [go, db]                   # go: toolchain, golangci-lint, gofumpt; db: psql
disk: 30                          # room for Docker images
ports: [8080]
setup: |
  if [ -f compose.yaml ] || [ -f docker-compose.yml ]; then docker compose up -d; fi
  go mod download
