# A Ruby on Rails app with Postgres in Docker.
# Start from it: limabean recipes rails && limabean up
packs: [ruby, node, db]           # node for the asset pipeline, db for psql
disk: 30
ports: [3000]
setup: |
  if [ -f compose.yaml ] || [ -f docker-compose.yml ]; then docker compose up -d; fi
  bundle install
