<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>
  body {
    background:
      radial-gradient(800px 500px at 50% 30%, rgba(143,209,106,0.18), transparent 70%),
      var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  }
  .grid { position: absolute; inset: 0; background-image:
      linear-gradient(rgba(143,209,106,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(143,209,106,0.06) 1px, transparent 1px);
    background-size: 40px 40px; mask-image: radial-gradient(closest-side, rgba(0,0,0,0.9), transparent); }
  img { width: 200px; height: 200px; position: relative; filter: drop-shadow(0 18px 30px rgba(0,0,0,0.45)); }
  h1 { position: relative; margin-top: 18px; font-size: 112px; font-weight: 800; letter-spacing: -4.5px; line-height: 1; }
  h1 span { color: var(--leaf); }
  p { position: relative; margin-top: 22px; font-size: 32px; color: var(--mist); }
  p b { color: var(--cream); font-weight: 600; }
</style></head>
<body>
  <div class="grid"></div>
  <img src="bean.svg" alt="">
  <h1>lima<span>bean</span></h1>
  <p>Disposable Linux dev VMs for macOS, <b>ready for SSH and Claude.</b></p>
</body></html>
