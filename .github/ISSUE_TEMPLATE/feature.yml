name: Feature request
description: Something limabean could do, or do better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The task, and where limabean gets in the way or falls short.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How it could work. A command or project file example helps.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today
      description: Workarounds, or other tools you use for it.
