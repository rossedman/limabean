name: release

# Pushing a tag like v0.1.0 tests the code, builds the macOS binary with
# GoReleaser, publishes a GitHub release with the archive, checksums and a
# changelog, and updates the Homebrew cask in rossedman/homebrew-tap.
# Configuration: .goreleaser.yaml.
#
# To (re)build an existing tag's release with this workflow, run it by hand
# with the tag: gh workflow run release.yml -f tag=v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, e.g. v0.1.0
        required: true

env:
  # GoReleaser otherwise picks whichever tag git describe finds, which is
  # wrong when a release candidate tag points at the same commit.
  GORELEASER_CURRENT_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write # publish the release
  id-token: write # keyless cosign signing and provenance
  attestations: write # build provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # GoReleaser builds the changelog from history
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # A cache another workflow wrote could poison the release build.
          cache: false
      - name: Test
        run: go test ./...
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained token with Contents: write on rossedman/homebrew-tap
          # only; GITHUB_TOKEN can't push to another repository.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      # Where and how each archive was built: gh attestation verify.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
