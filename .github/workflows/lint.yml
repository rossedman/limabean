name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test, with at least 90% coverage
        run: |
          go test -coverprofile=coverage.out ./...
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { sub("%", "", $3); print $3 }')
          echo "Total coverage: ${total}%" | tee -a "$GITHUB_STEP_SUMMARY"
          awk -v t="$total" 'BEGIN { exit !(t >= 90) }' || { echo "::error::Coverage ${total}% is below 90%"; exit 1; }
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  govulncheck:
    # Known vulnerabilities in the Go toolchain and modules limabean calls.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # A pinned version, checked against the Go checksum database.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: shellcheck templates/features/*.sh templates/files/limabean-network && shellcheck -s sh templates/files/env.sh templates/files/limabean-github-git templates/files/limabean-info templates/files/limabean-statusline

  lima-validate:
    runs-on: macos-latest
    env:
      LIMA_VERSION: 2.2.1
      LIMA_SHA256: 9e9eacce88f37e185c346bad73aa6136f738d8cdf8c3bb23cd42b071824bc66e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Lima
        run: |
          tarball="lima-${LIMA_VERSION}-Darwin-arm64.tar.gz"
          curl -fsSLO "https://github.com/lima-vm/lima/releases/download/v${LIMA_VERSION}/${tarball}"
          echo "${LIMA_SHA256}  ${tarball}" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/lima"
          tar -xzf "$tarball" -C "$RUNNER_TEMP/lima"
          echo "$RUNNER_TEMP/lima/bin" >> "$GITHUB_PATH"
      - name: Validate templates
        # Layers are only meaningful as bases; validate the environments built on them.
        run: |
          limactl --version
          for f in templates/*.yaml; do
            case "$(basename "$f")" in layer-*) continue ;; esac
            limactl tmpl validate "$f"
          done
