name: sarifix

# Runs the scanners in sarifix.yaml (golangci-lint, trivy, semgrep). On
# pushes to main, weekly and by hand it uploads their findings to code
# scanning (the Security tab) and keeps one issue per batch of findings; on
# pull requests it reports the findings the change introduced, in the job
# summary and as annotations. With the SARIFIX_QUEUE variable above 0 it
# labels that many issues agent-ready and starts agent-queue.yml for each.
# https://rossedman.io/sarifix/tutorials/claude-queue/
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 6 * * 1" # Mondays: new vulnerabilities and rules
  workflow_dispatch:

permissions: {}

concurrency:
  group: sarifix-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sarifix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write # dispatch agent-queue (also covers upload-sarif's read)
      security-events: write # code scanning upload
      issues: write # one issue per batch, and the agent-ready label
    env:
      # The version lint.yml runs, rather than the action's default.
      GOLANGCI_LINT_VERSION: 2.14.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # pull requests are compared with their merge base
          persist-credentials: false
      # golangci-lint type-checks the code, so it needs Go.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: rossedman/sarifix@706469faaa3f32eb199873b93219d195583e8537 # v0.3.1
        with:
          # The default mode: check on pull requests, issues everywhere else.
          queue: ${{ vars.SARIFIX_QUEUE }}
          # Start agent-queue for each issue queued: labels added with the
          # job's token start no workflows.
          dispatch: agent-queue.yml
